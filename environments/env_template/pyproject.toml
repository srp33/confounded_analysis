[project]
name = "YOUR_PROJECT_NAME"
version = "1.0.0"
description = "Batch effect correction analysis pipeline for RNA-seq data"
requires-python = "=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",

    # Dimensionality reduction and visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    
    # Utilities
    "tqdm>=4.65",
    
    # Data download and access
    "osfclient>=0.0.5",
    "pybiomart>=0.2",
    
    # Workflow management
    "snakemake>=7.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ipython>=8.14",
]

[tool.uv]