[workspace]
name = "example_env"
version = "0.1.0"
description = "Basic example environment"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# R
r-base = ">=4.4"
r-tidyverse = "*"

# Python
python = ">=3.12"
numpy = "*"
pandas = "*"

[tasks]
test-r = "R --vanilla -e 'library(tidyverse); cat(\"✓ R packages loaded\\n\")'"
test-python = "python -c 'import numpy; import pandas; print(\"✓ Python packages loaded\")'"
test = { depends-on = ["test-r", "test-python"] }
