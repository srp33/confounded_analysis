[project]
name = "book_chapter"
version = "1.0.0"
description = "Batch effect correction analysis pipeline for RNA-seq data"
requires-python = ">=3.10"
dependencies = [
    # Core scientific computing
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    
    # Deep learning frameworks
    "torch>=2.0",
    
    # Machine learning and fairness
    "aif360>=0.5",
    
    # Dimensionality reduction and visualization
    "umap-learn>=0.5",
    "opentsne>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    
    # Data I/O and formats
    "tables>=3.8",  # pytables for HDF5
    
    # Utilities
    "tabulate>=0.9",
    "jaxtyping>=0.2",
    "beartype>=0.15",
    "psutil>=5.9",
    "tqdm>=4.65",
    "rich>=13.0",
    "memory-profiler>=0.61",
    "py-cpuinfo>=9.0",
    
    # Data download and access
    "gdown>=4.7",
    "osfclient>=0.0.5",
    "pybiomart>=0.2",
    
    # Workflow management
    "snakemake>=7.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ipython>=8.14",
]

[tool.uv]
# Configure uv to use shared group storage
# These paths will be set via environment variables in init_env.sh
# UV_CACHE_DIR=/grphome/grp_batch_effects/.uv_cache
# UV_PROJECT_ENVIRONMENT=/grphome/grp_batch_effects/environments/python/book_chapter/.venv