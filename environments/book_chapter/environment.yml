name: book_chapter
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # === R Base ===
  - r-base=4.4.*
  
  # === System Libraries ===
  - openblas
  - glpk
  - libcurl
  - libxml2
  - openssl
  
  # === R Core Infrastructure ===
  - r-rcpp
  - r-rcpparmadillo
  - r-rcppeigen
  - r-bh
  - r-data.table
  - r-matrixstats
  - r-foreach
  - r-doparallel
  - r-future
  - r-remotes
  - r-matrix
  
  # === R Tidyverse ===
  - r-tidyverse
  - r-readxl
  
  # === R Statistical Packages ===
  - r-glmnet
  - r-e1071
  - r-ranger
  - r-caret
  - r-lme4
  - r-mclust
  - r-nnls
  - r-moments
  - r-pracma
  
  # === R Visualization ===
  - r-gridextra
  - r-gplots
  - r-rcolorbrewer
  - r-plotly
  - r-ggpubr
  - r-ggtext
  - r-corrplot
  - r-colorspace
  - r-scales
  - r-dt
  - r-kableextra
  
  # === Bioconductor Core (from conda-forge/bioconda) ===
  - bioconductor-biocmanager
  - bioconductor-summarizedexperiment
  - bioconductor-limma
  - bioconductor-vsn
  - bioconductor-annotationdbi
  - bioconductor-biomart
  - bioconductor-experimenthub
  - bioconductor-complexheatmap
  - bioconductor-biostrings
  - bioconductor-iranges
  - bioconductor-s4vectors
  - bioconductor-s4arrays
  
  # === Batch Correction ===
  - bioconductor-sva
  - bioconductor-batchelor
  - bioconductor-ruvseq
  
  # === R Machine Learning ===
  - r-rocr
  - r-xgboost
  
  # === R Dimensionality Reduction ===
  - r-rtsne
  - r-umap
  
  # === R Utilities ===
  - r-argparse
  - r-stringi
  
  # === R VS Code Integration ===
  - r-languageserver
  
  # === R Markdown ===
  - r-rmarkdown
  - r-shiny
  
  # === Python Base ===
  - python=3.12.*
  - pip
  
  # === Python Scientific Stack ===
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  
  # === Python Utilities ===
  - jupyter
  - ipython
