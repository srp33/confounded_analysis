# config.yaml

# Base folder for all final outputs, logs, and intermediate results
output_folder: "/outputs/book_chapter"

# Folder containing input data
data_folder: "/scripts/evaluations/book_chapter/data"

scripts_folder: "/scripts/evaluations/book_chapter/scripts"

batch_effect_variances: [1, 3, 5]
batch_effect_means: [0, 3, 5]

num_datasets: [3, 4, 5, 6]

classifiers: 
  - "logistic"
  - "elnet"
  - "svm"
  - "rf"
  - "lightgbm"
  - "nnet"

adjusters:
  - "unadjusted"
  - "combat"
  - "mnn"

split_seed_start: 42
split_seed_count: 100