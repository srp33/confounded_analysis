# PACE/POSSE Configuration
# Independent configuration for pace/posse analysis

# Base folder for outputs
output_folder: "outputs"

# Data folder
data_folder: "data"

# Scripts folder
scripts_folder: "scripts"

# PACE variants to test
pace_variants:
  - "default"
  - "v22"
  - "v23"
  - "v24"
  - "v25"
  - "v30"
  - "v31"
  - "v32"
  - "v34"
  - "v35"

# POSSE variants to test
posse_variants:
  - "v5"
  - "v6"

# Pathway sources
pathway_sources:
  - "MSigDB_Hallmark_2020"
  - "KEGG_2021_Human"
  - "GO_Biological_Process_2021"

# Hyperparameters for testing
pace_hyperparams:
  tau: [10.0, 25.0, 50.0]
  lambda_damp: [1.0, 2.0, 5.0]
  hard_gating_ratio: [0.05, 0.10, 0.20]

posse_hyperparams:
  tau: [10.0, 25.0, 50.0]
  top_k_percent: [0.10, 0.20, 0.30]
  max_iter: [3, 5, 10]

# Validation settings
validation:
  n_replicates: 10
  test_size: 0.3
  random_seed: 42
